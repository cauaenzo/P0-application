[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "note-organizer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]